# Check the dependency graph as we actually build it (we use candle's
# `metal` feature, never `mkl`). `all-features = true` would otherwise pull
# the `mkl` path and its `intel-mkl-src` crate, whose custom Intel license
# cargo-deny cannot parse ("unlicensed").
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Only flag unmaintained crates that are direct workspace dependencies; we
# cannot patch unmaintained transitive deps pulled by heavy ML crates like
# mistralrs without forking, and they carry no known security exposure.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    "NCSA",
    "CDLA-Permissive-2.0",
    # `intel-mkl-src` ships under the Intel Simplified Software License
    # (no SPDX id). pocket-tts depends on it unconditionally, but we build
    # candle with `metal` and never enable `mkl`, so no Intel MKL binary is
    # downloaded, linked or redistributed — only the (inert) wrapper crate
    # is compiled. Accepting it consciously and scoped via the clarify
    # below.
    "LicenseRef-Intel-Simplified-Software-License",
]
confidence-threshold = 0.9

# `intel-mkl-src` has no `license` field and a non-SPDX `License.txt`, so
# cargo-deny reports it "unlicensed". Map it to a custom LicenseRef so the
# decision is explicit and auditable rather than silently ignored.
[[licenses.clarify]]
name = "intel-mkl-src"
expression = "LicenseRef-Intel-Simplified-Software-License"
license-files = [{ path = "License.txt", hash = 0x3bf8c2d0 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# fluidaudio-rs is git-only (not published on crates.io); pinned by commit in
# the workspace Cargo.toml. Same org as the underlying Swift FluidAudio SDK.
allow-git = []
